# Configuration File for ERA5 Data ETL Pipeline
# Relative paths are resolved against the directory containing this file,
# so the pipeline can be launched from any working directory.

# Source of the hourly ERA5 fields:
#   netcdf: the daily NetCDF files of bucket_path, one ~50 MB file per field and day
#   zarr:   the analysis-ready ARCO-ERA5 Zarr store, reading only the chunks of the requested days
source: netcdf

# Path to the Google Cloud Storage bucket containing the daily NetCDF files
bucket_path: "gcp-public-data-arco-era5/raw/date-variable-single_level/"

# Zarr store read when source is zarr
zarr_store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"

# fsspec options of the GCS filesystem. The ERA5 bucket is public: anonymous access
# skips the lookup of Google credentials, which costs ~25 s per file when none are configured.
storage_options:
  token: anon

# Storage of the processed data:
#   parquet: Hive-partitioned Parquet files, <output_path>/<variable>/year=YYYY/month=MM
#   iceberg: Apache Iceberg tables <iceberg_namespace>.<variable>, partitioned by day
sink: parquet

# Root directory of the output Parquet files
output_path: "../output"

# Iceberg sink: a local SQLite catalog and the table files, in the warehouse directory
iceberg_warehouse_path: "../output/iceberg"
iceberg_namespace: era5
# Any other pyiceberg catalog can be used instead of the local one, e.g. a REST catalog:
# iceberg_catalog:
#   type: rest
#   uri: https://iceberg-catalog.example.com
#   warehouse: gs://my-bucket/warehouse

# Directory path where the query results will be saved
query_output_path: "../output/query_results"

# Directory path where the precomputed H3 lookup table is cached (shared by all variables, same grid)
h3_lookup_path: "../output/h3_lookup"

# H3 Resolution
# The resolution of H3 indices to be used for geospatial indexing (integer value).
h3_resolution: 5

# Variables to process, among the supported ones (see src/utils/variables.py):
#   total_precipitation:  column 'tp', meters, aggregates: sum (reported in mm)
#   2m_temperature:       column 't2m', Kelvin, aggregates: mean, min, max (reported in °C)
#   10m_wind_speed:       column 'ws10', m/s, derived from the u/v wind components
#   2m_relative_humidity: column 'rh2m', %, derived from the temperature and the dewpoint
variables:
  - total_precipitation
  - 2m_temperature

# File Name
# The name of the file to process within the bucket for each date and variable (e.g., 'surface.nc').
file_name: "surface.nc"

# Number of attempts for each daily download before the day is marked as failed
max_retries: 3

# Variable-days processed in parallel by worker threads (each holds a day in memory, ~1.5 GB)
workers: 4

# Data contract: share of missing values above which a variable-day is rejected
max_null_fraction: 0.01

# First day of the daily partitions of the Dagster assets (src/orchestration)
partitions_start_date: "2022-01-01"

# Sample Queries
# Each query targets one variable and supports any combination of the following filters:
#   start / end: date range in YYYY-MM-DD format, both days included
#   h3_index:    H3 cell identifier
#   bbox:        {lat_min, lat_max, lon_min, lon_max}, longitudes in the ERA5 0-360 convention
#   point:       {latitude, longitude, tolerance}, nearest grid point within the tolerance (degrees)
# aggregate: one or a list of the aggregates supported by the variable; the values are
# reported in the log instead of saving the rows to Parquet.
queries:
  - name: time_range
    variable: total_precipitation
    start: "2022-01-15"
    end: "2022-03-31"

  - name: geo_time_range
    variable: total_precipitation
    h3_index: "85df6c57fffffff"
    start: "2022-05-01"
    end: "2022-06-30"

  - name: h3_index
    variable: total_precipitation
    h3_index: "85032097fffffff"

  - name: zurich_april_total
    variable: total_precipitation
    point: {latitude: 47.25, longitude: 8.5, tolerance: 0.01}
    start: "2022-04-01"
    end: "2022-04-30"
    aggregate: sum

  - name: zurich_april_temperature
    variable: 2m_temperature
    point: {latitude: 47.25, longitude: 8.5, tolerance: 0.01}
    start: "2022-04-01"
    end: "2022-04-30"
    aggregate: [mean, min, max]

  - name: po_valley_july_temperature
    variable: 2m_temperature
    bbox: {lat_min: 44.5, lat_max: 45.5, lon_min: 8.0, lon_max: 12.0}
    start: "2022-07-01"
    end: "2022-07-31"
