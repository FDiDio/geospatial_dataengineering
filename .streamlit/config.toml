# Theme of the dashboard (src/dashboard/app.py): Streamlit reads it from the working directory
[theme]
# A technical look, of instrument panels and terminals: Chakra Petch for the headings, IBM Plex Sans for the text,
# JetBrains Mono for the code, the coordinates and the values of the metrics (set in app.py)
headingFont = "'Chakra Petch':https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap"
font = "'IBM Plex Sans':https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
baseRadius = "0.75rem"
buttonRadius = "full"
metricValueFontSize = "1.6rem"
metricValueFontWeight = 600
headingFontWeights = [700, 700, 600, 600, 600, 600]
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#fbfbfa"
secondaryBackgroundColor = "#f1f3f6"
textColor = "#1c2430"
borderColor = "#e3e7ec"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0f1318"
secondaryBackgroundColor = "#181e26"
textColor = "#e6e9ee"
borderColor = "#2a323d"
